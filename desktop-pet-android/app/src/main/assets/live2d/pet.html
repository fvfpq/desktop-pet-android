<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LoliPet Live2D</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-tap-highlight-color: transparent;
    }
    #stage {
        width: 100%; height: 100%;
        display: block;
        background: transparent;
    }
    /* 顶部悬浮控制条 */
    #toolbar {
        position: fixed; top: 0; left: 0; right: 0;
        height: 34px;
        display: flex; justify-content: flex-end; align-items: center;
        gap: 4px; padding: 0 8px;
        background: rgba(0,0,0,0.25);
        border-radius: 0 0 12px 12px;
        transition: opacity .2s;
        z-index: 10;
    }
    #toolbar.hidden { opacity: 0; pointer-events: none; }
    #toolbar button {
        border: none; background: rgba(255,255,255,0.85);
        color: #E8557F; font-size: 14px; font-weight: bold;
        border-radius: 14px; padding: 3px 10px;
        cursor: pointer;
    }
</style>
</head>
<body>
<div id="toolbar" class="hidden">
    <button onclick="window.__exit()">收起</button>
</div>
<canvas id="stage"></canvas>
<script src="libs/live2d.min.js"></script>
<script src="libs/live2dcubismcore.min.js"></script>
<script src="libs/pixi-bundle.js"></script>
<script src="libs/spine-base.js"></script>
<script src="libs/pixi-spine.js"></script>
<script>
window.PIXI.spine.base = window.PIXI.spine.base || window.PIXI.spine;
</script>
<script src="libs/spine-runtime-3.8.js"></script>
<script>
(function () {
    "use strict";
    var app = null;
    var model = null;
    var currentMood = "idle";
    var modelName = "shizuku";
    var pendingState = null;
    var isTalking = false;
    var bobPhase = 0;
    var face = { happy: 0, shy: 0, sad: 0, angry: 0 };

    // 模型适配：不同模型 motion 组名与表情名不同
    var cfg = {
        shizuku: {
            modelFile: "shizuku.model.json",
            idleGroup: "idle",
            tapGroup: "tap_body",
            exp: { happy: "f01", sad: "f02", shy: "f03", angry: "f04" }
        },
        haru: {
            modelFile: "haru_greeter_t03.model3.json",
            idleGroup: "Idle",
            tapGroup: "Tap",
            exp: { happy: "f01", sad: "f03", shy: "f02", angry: "f04" }
        },
        tsumiki: {
            modelFile: "tsumiki.model.json",
            idleGroup: "idle",
            tapGroup: "",
            exp: { happy: "F01", sad: "F02", shy: "F03", angry: "F04" }
        },
        nico: {
            modelFile: "nico.model.json",
            idleGroup: "idle",
            tapGroup: "",
            exp: { happy: null, sad: null, shy: null, angry: null }
        },
        koharu: {
            modelFile: "koharu.model.json",
            idleGroup: "idle",
            tapGroup: "",
            exp: { happy: null, sad: null, shy: null, angry: null }
        },
        lisa: {
            modelFile: "build_char_358_lisa.skel",
            type: "spine",
            idleMotion: "Relax",
            tapMotion: "Interact",
            moodMotion: { happy: "Relax", sad: "Sit", shy: "Relax", angry: "Interact" },
            randomMotions: ["Relax", "Move", "Sit", "Sleep"]
        }
    };
    function getCfg() {
        return cfg[modelName] || cfg.shizuku;
    }

    function isSpineModel() {
        return getCfg().type === "spine" || (model && model.spineData);
    }

    function spineMotion(name) {
        var c = getCfg();
        if (!name) return;
        try {
            var anims = model.spineData.animations;
            var found = null;
            for (var i = 0; i < anims.length; i++) {
                var n = typeof anims[i] === "string" ? anims[i] : anims[i].name;
                if (n === name) { found = n; break; }
            }
            if (found) {
                model.state.setAnimation(0, found, name === (c.idleMotion || "Default"));
            }
        } catch (e) {}
    }

    // 从 URL 参数读取模型名
    (function () {
        try {
            var m = window.location.search.match(/[?&]model=([^&]+)/);
            if (m) modelName = decodeURIComponent(m[1]);
        } catch (e) { modelName = "shizuku"; }
    })();

    function createApp() {
        var canvas = document.getElementById("stage");
        app = new window.PIXI.Application({
            view: canvas,
            backgroundAlpha: 0,
            preserveDrawingBuffer: true,
            autoStart: true,
            resizeTo: window,
            antialias: true,
            resolution: Math.min(window.devicePixelRatio || 1, 2)
        });
    }

    function pickRandom(arr) {
        if (!arr || arr.length === 0) return null;
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function loadModel(name) {
        var c = cfg[name] || cfg.shizuku;
        if (c.type === "spine") {
            return loadSpineModel(name, c);
        }
        var path = "models/" + name + "/" + c.modelFile;
        return new Promise(function (resolve, reject) {
            if (!window.Live2DModel) { reject(new Error("Live2DModel 未加载")); return; }
            window.Live2DModel.from(path, {
                autoInteract: false,
                motionPreload: "idle",
                idleMotionGroup: c.idleGroup
            }).then(function (m) {
                resolve(m);
            }).catch(reject);
        });
    }

    function loadTexture(url) {
        return new Promise(function (resolve, reject) {
            var loader = window.PIXI.Loader.shared || new window.PIXI.Loader();
            loader.reset();
            loader.add("img", url);
            loader.load(function (l, res) {
                if (res.img && res.img.texture) resolve(new window.PIXI.Texture(res.img.texture.baseTexture));
                else if (res.img) resolve(res.img);
                else reject(new Error("texture load fail"));
            });
        });
    }

    function loadSpineModel(name, c) {
        var base = "models/" + name + "/" + c.modelFile.replace(/\.skel$/, "");
        var skelUrl = base + ".skel";
        var atlasUrl = base + ".atlas";
        var pngUrl = base + ".png";
        return fetch(skelUrl).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
            return fetch(atlasUrl).then(function (r) { return r.text(); }).then(function (atlasText) {
                return loadTexture(pngUrl).then(function (tex) {
                    var core = window.PIXI.spine38 || window.PIXI.spine;
                    var atlasCls = window.PIXI.spine.TextureAtlas || core.TextureAtlas;
                    var atlas = new atlasCls(atlasText, function (line, cb) { cb(tex); });
                    var atlasLoader = new core.AtlasAttachmentLoader(atlas);
                    var binary = new core.SkeletonBinary(atlasLoader);
                    binary.scale = 1;
                    var skeletonData = binary.readSkeletonData(new Uint8Array(buf));
                    var spine = new window.PIXI.spine.Spine(skeletonData);
                    spine.autoUpdate = true;
                    return spine;
                });
            });
        });
    }

    function applyExpression(name) {
        try { model.expression(name); } catch (e) {}
    }

    // 情绪 -> 表情（按模型适配）
    function moodExpr(mood) {
        var c = getCfg();
        return c.exp[mood] || null;
    }

    function playTap() {
        var c = getCfg();
        if (isSpineModel()) {
            spineMotion(c.tapMotion || "Interact");
            var idle = c.idleMotion || "Default";
            var self = model;
            setTimeout(function () {
                if (self && self.state) {
                    var current = self.state.tracks[0];
                    if (!current || current.animation.name === (c.tapMotion || "Interact")) {
                        self.state.setAnimation(0, idle, true);
                    }
                }
            }, 1600);
            return;
        }
        var group = c.tapGroup;
        try {
            if (group) {
                model.motion(group);
            } else {
                // 无专用点击组时，从默认组随机播一个动作
                model.motion();
            }
        } catch (e) {}
    }

    function playMood(mood) {
        if (!model) return;
        currentMood = mood;
        if (isSpineModel()) {
            var mm = getCfg().moodMotion || {};
            var m = mm[mood] || getCfg().idleMotion || "Default";
            spineMotion(m);
            return;
        }
        var expr = moodExpr(mood);
        if (expr) applyExpression(expr);
        playTap();
    }

    function setMood(mood) {
        if (!model) return;
        if (mood === "idle") {
            currentMood = "idle";
            if (isSpineModel()) {
                try { spineMotion(getCfg().idleMotion || "Default"); } catch (e) {}
                return;
            }
            // 重置到默认表情并播放空闲
            try { model.expression(null); } catch (e) {}
            try { model.motion(getCfg().idleGroup); } catch (e) {}
            return;
        }
        if (mood === "shy") {
            face.shy = 1;
            if (isSpineModel()) {
                var sm = getCfg().moodMotion || {};
                spineMotion(sm.shy || "Relax");
                setTimeout(function () { face.shy = 0; }, 3000);
                return;
            }
            var expr = moodExpr("shy");
            if (expr) applyExpression(expr);
            playTap();
            // 脸红渐退
            setTimeout(function () { face.shy = 0; }, 3000);
            return;
        }
        playMood(mood);
    }

    // 说话嘴型：驱动嘴部参数开合
    var mouthTimer = null;
    var mouthPhase = 0;
    function setMouthOpen(v) {
        if (isSpineModel()) return;
        try {
            var core = model.internalModel && model.internalModel.coreModel;
            if (core && core.setParameterValueById) {
                core.setParameterValueById("ParamMouthOpenY", v);
                core.setParameterValueById("ParamMouthForm", v * 0.3);
            }
        } catch (e) {}
    }
    function startTalking() {
        isTalking = true;
        if (isSpineModel()) {
            try { spineMotion("Move"); } catch (e) {}
            return;
        }
        try { model.motion(getCfg().idleGroup); } catch (e) {}
        if (mouthTimer) clearInterval(mouthTimer);
        mouthTimer = setInterval(function () {
            mouthPhase = (mouthPhase + 1) % 4;
            var v = mouthPhase < 3 ? 0.35 + 0.65 * Math.abs(Math.sin(mouthPhase * 1.2)) : 0.05;
            setMouthOpen(v);
        }, 120);
    }
    function stopTalking() {
        isTalking = false;
        if (isSpineModel()) {
            try { spineMotion(getCfg().idleMotion || "Default"); } catch (e) {}
            return;
        }
        if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
        setMouthOpen(0);
        if (currentMood !== "idle") {
            setMood(currentMood);
        } else {
            try { model.expression(null); } catch (e) {}
            try { model.motion(getCfg().idleGroup); } catch (e) {}
        }
    }

    function resizeModel() {
        if (!model) return;
        if (isSpineModel()) {
            try {
                var bounds = model.getBounds();
                var bw = bounds.width, bh = bounds.height;
                if (bw > 1 && bh > 1) {
                    var s = Math.min(window.innerWidth / bw * 0.9, window.innerHeight / bh * 0.85);
                    model.scale.set(s);
                } else {
                    model.scale.set(Math.min(window.innerWidth, window.innerHeight) / 800);
                }
                var b2 = model.getBounds();
                model.x = (window.innerWidth - b2.width) / 2 - b2.x;
                model.y = (window.innerHeight - b2.height) / 2 - b2.y;
            } catch (e) {
                model.scale.set(Math.min(window.innerWidth, window.innerHeight) / 800);
                model.x = window.innerWidth / 2;
                model.y = window.innerHeight / 2;
            }
            return;
        }
        var scale = Math.min(window.innerWidth, window.innerHeight) / 1000;
        model.scale.set(scale * 0.9);
        model.x = window.innerWidth / 2;
        model.y = window.innerHeight * 0.96;
        model.anchor.set(0.5, 1);
    }

    function resetIdle() {
        if (!model) return;
        setMood("idle");
    }

    // 随机空闲行为
    function scheduleRandomAction() {
        var actions = ["blink", "idle", "look"];
        setTimeout(function () {
            try {
                if (!isTalking && currentMood === "idle") {
                    var a = pickRandom(actions);
                    if (a === "blink") {
                        if (isSpineModel()) {
                            var rm = getCfg().randomMotions || ["Relax", "Move"];
                            var m = pickRandom(rm);
                            spineMotion(m);
                            setTimeout(function () {
                                try { if (currentMood === "idle") spineMotion(getCfg().idleMotion || "Relax"); } catch (e) {}
                            }, 2500 + Math.random() * 2500);
                        } else {
                            playTap();
                            setTimeout(resetIdle, 400);
                        }
                    }
                }
            } catch (e) {}
            scheduleRandomAction();
        }, 4000 + Math.random() * 4000);
    }

    function init() {
        createApp();
        loadModel(modelName).then(function (m) {
            model = m;
            app.stage.addChild(model);
            resizeModel();
            window.addEventListener("resize", resizeModel);
            setMood("idle");
            scheduleRandomAction();
            // 通知原生已就绪
            if (window.__onReady) window.__onReady(modelName);
        }).catch(function (err) {
            console.error("模型加载失败:", err);
            if (window.__onError) window.__onError(String(err && err.message || err));
        });
    }

    // 暴露给原生的 API
    window.__api = {
        setMood: setMood,
        startTalking: startTalking,
        stopTalking: stopTalking,
        reset: resetIdle,
        setModel: function (name) {
            modelName = name;
            var old = model;
            model = null;
            loadModel(name).then(function (m) {
                if (old) app.stage.removeChild(old);
                model = m;
                app.stage.addChild(model);
                resizeModel();
                setMood("idle");
            }).catch(function (err) {
                model = old;
                if (window.__onError) window.__onError(String(err && err.message || err));
            });
        }
    };

    // 点击舞台 -> 交互反馈
    document.getElementById("stage").addEventListener("pointerdown", function (e) {
        if (window.__onTap) window.__onTap(e.clientX, e.clientY);
    });

    init();
})();
</script>
</body>
</html>
